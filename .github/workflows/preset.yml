name: Build a country preset

# Generating a preset needs to reach radio-browser.info and then connect to
# every candidate stream, which is exactly the kind of network access a
# development machine often does not have. This does it on a runner and hands
# back the file for review -- it deliberately does not commit to master, because
# the generator cannot judge whether a station belongs in a national preset.
# What it can do is open a pull request, which is a place to read the file and
# edit it before it becomes real; the artifact stays for anyone who would rather
# download it. See presets/README.md.

on:
  workflow_dispatch:
    inputs:
      country:
        description: 'ISO 3166-1 alpha-2 country code, e.g. fi'
        required: true
        type: string
      candidates:
        description: 'How many stations to consider'
        required: false
        default: '60'
        type: string
      per_category:
        description: 'Cap per category'
        required: false
        default: '8'
        type: string
      open_pr:
        description: 'Open a pull request with the result'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  preset:
    name: Generate
    runs-on: ubuntu-24.04
    # Every candidate stream is connected to, one at a time. Sixty of them with
    # a twelve-second bound each is the worst case, and the logo lookup adds a
    # request per station the directory has no favicon for.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Check the country code
        env:
          COUNTRY: ${{ inputs.country }}
        run: |
          printf '%s' "$COUNTRY" | grep -Eqx '[A-Za-z]{2}' \
            || { echo "'$COUNTRY' is not a two-letter country code"; exit 1; }

      - name: Generate and verify
        env:
          COUNTRY: ${{ inputs.country }}
          CANDIDATES: ${{ inputs.candidates }}
          PER_CATEGORY: ${{ inputs.per_category }}
        run: |
          CC=$(printf '%s' "$COUNTRY" | tr '[:upper:]' '[:lower:]')
          ./script/make-preset.py \
            --country "$CC" \
            --out "presets/$CC.ini" \
            --candidates "$CANDIDATES" \
            --per-category "$PER_CATEGORY"
          echo "--- presets/$CC.ini ---"
          cat "presets/$CC.ini"

      - name: Upload it for review
        uses: actions/upload-artifact@v4.4.3
        with:
          name: preset-${{ inputs.country }}
          path: presets/*.ini
          if-no-files-found: error

      - name: Open a pull request with it
        if: inputs.open_pr
        env:
          GH_TOKEN: ${{ github.token }}
          COUNTRY: ${{ inputs.country }}
        run: |
          set -eu
          CC=$(printf '%s' "$COUNTRY" | tr '[:upper:]' '[:lower:]')
          # --porcelain rather than `git diff --quiet`: a preset that did
          # not exist before is untracked, and git diff does not see untracked
          # files at all. The first run for a country -- the whole point of
          # this -- reported "unchanged" and opened nothing.
          if [ -z "$(git status --porcelain -- presets/)" ]; then
            echo "presets/$CC.ini is unchanged; nothing to open."
            exit 0
          fi

          # Dated, and named for the country: two runs for different countries
          # must not land on the same branch, and a rerun for the same one must
          # not overwrite a pull request nobody has read yet.
          BRANCH="preset/$CC-$(date -u +%Y-%m-%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "presets/$CC.ini"
          git commit -m "A generated preset for $CC"
          git push -u origin "$BRANCH"

          {
            echo "Generated by \`Build a country preset\`. Every URL in it was"
            echo "connected to and answered with audio; logos come from each"
            echo "station's own site where the directory had none."
            echo
            echo "**This is a starting point, not a preset.** The generator is"
            echo "good at proving a URL plays and bad at knowing whether a"
            echo "station belongs in a national list: it sorts by click-count"
            echo "and groups by whatever tag radio-browser happens to carry."
            echo "Rename the categories to something a person would recognise,"
            echo "drop the noise, and put the broadcaster's own channels first."
            echo "presets/README.md says what belongs here and why."
            echo
            echo '```ini'
            cat "presets/$CC.ini"
            echo '```'
            echo
            echo '---'
            echo '_Generated by [Claude Code](https://claude.ai/code)_'
          } > "$RUNNER_TEMP/body.md"

          # Opening the pull request is the last step, and the only one that
          # needs a permission the repository may not have granted: "Allow
          # GitHub Actions to create and approve pull requests" is off by
          # default, and gh then fails with "GitHub Actions is not permitted to
          # create or approve pull requests". The branch is already pushed by
          # that point, so the run has done its work and the change is one
          # click away -- failing the whole run would only hide that behind a
          # red cross. Warn, say exactly which setting, and link the compare
          # page.
          if ! gh pr create --base master --head "$BRANCH" \
               --title "A generated preset for $CC, for review" \
               --body-file "$RUNNER_TEMP/body.md"; then
            echo "::warning::The branch $BRANCH is pushed, but Actions may not open pull requests here. Enable Settings -> Actions -> General -> Workflow permissions -> 'Allow GitHub Actions to create and approve pull requests', or open it yourself: https://github.com/${GITHUB_REPOSITORY}/compare/master...${BRANCH}?expand=1"
          fi
