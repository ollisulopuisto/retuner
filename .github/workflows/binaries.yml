name: build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
  # Called by release.yml, which passes the tag to publish (e.g. v26.08.28.4).
  # Without a tag this is the ordinary build: artifacts only, nothing published.
  workflow_call:
    inputs:
      release_tag:
        description: 'Publish the build as this tag, e.g. v26.08.28.4'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# A push supersedes the run before it. A called run carries its tag in the
# group, so a release is never superseded by the next push.
concurrency:
  group: binaries-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            # macos-13 was retired (Dec 2025). macos-15-intel is GitHub's documented
            # Intel replacement label, announced as available until August 2027.
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-2022
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Go
        uses: actions/setup-go@v5.1.0
        with:
          go-version: '1.24'

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: bash ./script/build.sh
        shell: bash

      - name: Smoke test
        if: runner.os != 'Windows'
        run: bash ./script/smoke-test.sh
        shell: bash

      - name: The rest of the suite, on the platform people actually run
        if: runner.os == 'macOS'
        run: |
          bash ./script/test-presets.sh
          bash ./script/test-radiobrowser.sh
          bash ./script/test-preset-strikes.sh
          bash ./script/test-preset-icons.sh
          bash ./script/fuzz-test.sh
        shell: bash

      - name: Package
        id: package
        shell: bash
        run: |
          # The release tag when release.yml called this, else the version
          # written down in src/common.pas (the Go binary reports the same one;
          # internal/config has a test that keeps them equal). The updater asks
          # for retuner-<tag without v>-<target>.tar.gz.
          tag="${{ inputs.release_tag }}"
          if [ -n "$tag" ]; then
            version="${tag#v}"
          else
            version=$(sed -n "s/^ *APP_VERSION *= *'\([0-9.]*\)'.*/\1/p" src/common.pas)
          fi
          [ -n "$version" ] || { echo "no version"; exit 1; }

          out_arch="${{ matrix.arch }}"
          if [ "$out_arch" = "amd64" ]; then
             out_arch="x86_64"
          elif [ "$out_arch" = "arm64" ]; then
             out_arch="aarch64"
          fi

          target=${out_arch}-${{ matrix.os }}

          echo "packaging $target"
          stage="retuner-$version-$target"
          mkdir -p "$stage/config"
          if [ "${RUNNER_OS}" = Windows ]; then
            cp "bin/$target/retuner.exe" "$stage/"
          else
            cp "bin/$target/retuner" "$stage/"
          fi
          cp cfg/retuner.ini "$stage/"
          cp cfg/avr.ini cfg/stations.ini cfg/podcasts.ini "$stage/config/"
          cp LICENSE.txt README.md "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
          echo "name=$stage" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l "$stage.tar.gz"

      - name: Upload
        uses: actions/upload-artifact@v4.4.3
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish the release
    if: ${{ inputs.release_tag != '' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4.1.8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          ls -l dist
          tag=$RELEASE_TAG
          # The updater verifies against this file.
          ( cd dist && sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS )
          cat dist/SHA256SUMS
          notes="doc/release-notes/$tag.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --generate-notes
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS --title "Retuner $tag" "$@"
          fi
