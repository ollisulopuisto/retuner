name: build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # A check-only run of the whole matrix, from the Actions tab, for a branch
  # with no PR.
  workflow_dispatch:

# A push supersedes the run before it.
concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    # Queue time does not count towards this, only running time. The suites
    # take minutes; the default limit is six hours, which is what a hung
    # server used to burn.
    timeout-minutes: 25
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-2022
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Go
        uses: actions/setup-go@v5.1.0
        with:
          go-version: '1.24'

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: bash ./script/build.sh
        shell: bash

      - name: Smoke test
        if: runner.os != 'Windows'
        run: bash ./script/smoke-test.sh
        shell: bash

      - name: The rest of the suite, on the platform people actually run
        if: runner.os == 'macOS'
        run: |
          bash ./script/test-presets.sh
          bash ./script/test-radiobrowser.sh
          bash ./script/test-preset-strikes.sh
          bash ./script/test-preset-icons.sh
          bash ./script/fuzz-test.sh
        shell: bash

      - name: Package
        id: package
        shell: bash
        run: |
          version="2.0.0"

          out_arch="${{ matrix.arch }}"
          if [ "$out_arch" = "amd64" ]; then
             out_arch="x86_64"
          elif [ "$out_arch" = "arm64" ]; then
             out_arch="aarch64"
          fi

          target=${out_arch}-${{ matrix.os }}

          echo "packaging $target"
          stage="retuner-$version-$target"
          mkdir -p "$stage/config"
          if [ "${RUNNER_OS}" = Windows ]; then
            cp "bin/$target/retuner.exe" "$stage/"
          else
            cp "bin/$target/retuner" "$stage/"
          fi
          cp cfg/retuner.ini "$stage/"
          cp cfg/avr.ini cfg/stations.ini cfg/podcasts.ini "$stage/config/"
          cp LICENSE.txt README.md "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
          echo "name=$stage" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l "$stage.tar.gz"

      - name: Upload
        uses: actions/upload-artifact@v4.4.3
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error
