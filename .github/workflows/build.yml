name: PR tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: bash ./script/build.sh
        shell: bash

      - name: Test
        run: |
          bash ./script/smoke-test.sh
        shell: bash
