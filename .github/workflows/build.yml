name: PR tests

# Pushes are tested on master only. Every PR is tested on its merge result
# (pull_request), which is the check that matters before a merge; a branch with
# no PR gets nothing until someone asks: run this workflow by hand from the
# Actions tab. The manual run only tests. It builds nothing for release and
# publishes nothing.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# A newer push to the same ref supersedes the run before it.
concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The suites take about two minutes. The default limit is six hours, which
    # is what a hung server used to burn.
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Go
        uses: actions/setup-go@v5.1.0
        with:
          go-version: '1.24'

      - name: Build
        run: bash ./script/build.sh
        shell: bash

      - name: Test
        run: |
          bash ./script/smoke-test.sh
          bash ./script/test-presets.sh
          bash ./script/test-radiobrowser.sh
          bash ./script/test-preset-strikes.sh
          bash ./script/test-preset-icons.sh
          bash ./script/fuzz-test.sh
        shell: bash
