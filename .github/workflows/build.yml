name: PR tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Go
        uses: actions/setup-go@v5.1.0
        with:
          go-version: '1.24'

      - name: Build
        run: bash ./script/build.sh
        shell: bash

      - name: Test
        run: |
          bash ./script/smoke-test.sh
          bash ./script/test-presets.sh
          bash ./script/test-radiobrowser.sh
          bash ./script/test-preset-strikes.sh
          bash ./script/test-preset-icons.sh
          bash ./script/fuzz-test.sh
        shell: bash
